name: neural_viz_example
description: >-
  Playground, gallery and screenshot harness for the neural_viz package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  neural_viz:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # Both families are SIL OFL 1.1; licenses in assets/fonts/.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500

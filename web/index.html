<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Train your own AI, grow your hardware, and evolve from a perceptron to AGI. A neural-network idle game.">
  <meta name="theme-color" content="#07090D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Neural Idle">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Neural Idle</title>
  <style>
    html, body { margin: 0; padding: 0; background: #07090D; color: #E6EDF3; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; }
    #loading svg { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Neural Idle">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M10 10L30 20L10 30M10 10V30" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="4" fill="#22D3EE"/>
      <circle cx="10" cy="30" r="4" fill="#22D3EE"/>
      <circle cx="30" cy="20" r="4" fill="#A78BFA"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
      document.documentElement.lang = navigator.language.startsWith('es') ? 'es' : 'en';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

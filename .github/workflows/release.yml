name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build and publish signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Require all signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo '::error::Release cancelled: all four Android signing secrets are required. Debug signing is never used for a published release.'
            exit 1
          fi
      - name: Check out tag
        uses: actions/checkout@v6
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve app dependencies
        run: flutter pub get
      - name: Build signed release APK and app bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Create GitHub Release with APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Neural Idle $RELEASE_TAG" --generate-notes \
            'build/app/outputs/flutter-apk/app-release.apk#Neural Idle Android APK' \
            'build/app/outputs/bundle/release/app-release.aab#Neural Idle Android App Bundle'
      - name: Remove decoded signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/neural-idle-signing/release-keystore.jks"

name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    name: Require green CI for the current main commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify commit and CI result
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Manual Pages deployments must run from main.'
            exit 1
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$COMMIT_SHA" != "$main_sha" ]]; then
            echo '::error::This commit is no longer the current main. Refusing a stale deployment.'
            exit 1
          fi
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&event=push&branch=main&per_page=100" \
            --jq '.workflow_runs | sort_by(.id) | last')
          if [[ $(jq -r '.status' <<< "$ci_run") != completed || $(jq -r '.conclusion' <<< "$ci_run") != success ]]; then
            echo '::error::The latest push CI run for this exact main commit must finish successfully before deployment.'
            exit 1
          fi
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build web release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7 # the SDK the project is developed and tested with
          cache: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Resolve app dependencies
        run: flutter pub get
      - name: Build Flutter web
        run: flutter build web --release --base-href /IDLE-game/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: [gate, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to publish an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$COMMIT_SHA" != "$main_sha" ]]; then
            echo '::error::Main changed during the build. A fresh green CI run must deploy it.'
            exit 1
          fi
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&event=push&branch=main&per_page=100" \
            --jq '.workflow_runs | sort_by(.id) | last')
          if [[ $(jq -r '.status' <<< "$ci_run") != completed || $(jq -r '.conclusion' <<< "$ci_run") != success ]]; then
            echo '::error::CI is no longer green for this exact commit. Refusing to publish.'
            exit 1
          fi
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
